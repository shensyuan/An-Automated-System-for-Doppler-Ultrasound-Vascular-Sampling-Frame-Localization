apply plugin: 'com.android.application'
apply plugin: 'de.undercouch.download'

android {
    namespace 'org.tensorflow.lite.examples.superresolution'
    compileSdk 34

    defaultConfig {
        applicationId "org.tensorflow.lite.examples.superresolution"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
                abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                arguments "-DOpenCV_DIR=${project.rootDir}/opencv/native", "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
            packaging {
                jniLibs { keepDebugSymbols += ["**/*.so"] }
            }
        }
    }

    androidResources {
        noCompress "tflite"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../libraries/tensorflowlite/jni',
                               '../libraries/tensorflowlite-gpu/jni']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cc/CMakeLists.txt"
            version "3.22.1"
        }
    }
    ndkVersion '26.3.11579264'
}

// import download tasks
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'

apply from: 'download.gradle'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'com.google.android.material:material:1.12.0'
    implementation project(path: ':opencv')

}